<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shelf Life Chart</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #1b7a32;
            --primary-light: #e8f5e9;
            --primary-dark: #145c26;
            --surface: #ffffff;
            --bg: #f4f6f4;
            --text: #1a1a1a;
            --text-secondary: #5c5c5c;
            --border: #e0e4e0;
            --danger: #c62828;
            --radius: 16px;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 28px rgba(0,0,0,0.12);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        .main {
            padding: 12px 16px 100px;
            max-width: 480px;
            margin: 0 auto;
        }
        
        #quickNav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            padding: 10px 0 14px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
        }
        
        .nav-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
        }
        
        .nav-btn:active { opacity: 0.85; }
        
        .nav-toggle {
            background: #4a4a4a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 9999px;
            font-size: 12px;
            cursor: pointer;
            margin-left: auto;
        }
        
        .search-wrap {
            position: relative;
            width: 100%;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 42px 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .search-input:focus {
            border-color: var(--primary);
        }
        
        .search-input::placeholder {
            color: #999;
        }
        
        /* Hide the native browser clear button */
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-decoration {
            -webkit-appearance: none;
            appearance: none;
            display: none;
        }
        
        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e0e0e0;
            border: none;
            color: #555;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
        }
        
        .search-clear.visible {
            display: flex;
        }
        
        .search-clear:active {
            background: #ccc;
        }
        
        .section-header {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin: 24px 0 12px;
            padding: 0 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .section-header:first-of-type { margin-top: 4px; }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .product-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1.5px solid transparent;
            cursor: pointer;
            min-height: 108px;
        }
        
        .product-card:active {
            transform: scale(0.97);
        }
        
        .product-card.selected {
            background: var(--primary-light);
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }
        
        .product-name {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        
        .shelf-life {
            font-size: 12px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 600;
        }
        
        .product-card.selected .shelf-life {
            background: var(--primary);
            color: white;
        }
        
        .result {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 28px 20px 36px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            width: 100%;
            max-width: 480px;
            z-index: 9999;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: slideUpModal 0.28s cubic-bezier(0.32, 0.72, 0, 1) forwards;
        }
        
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9998;
            display: none;
            backdrop-filter: blur(2px);
        }
        
        .modal-backdrop.show { display: block; }
        
        @keyframes slideUpModal {
            from { opacity: 0; transform: translateX(-50%) translateY(100%); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f0f0;
            border: none;
            font-size: 20px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        
        .modal-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 16px;
            margin-top: 4px;
        }
        
        .expiry-card {
            background: var(--surface);
            border: 2.5px solid #222;
            border-radius: 14px;
            padding: 22px 16px;
            margin: 0 auto;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        
        .expiry-product {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.2;
        }
        
        .expiry-weekday {
            font-size: 24px;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 2px;
        }
        
        .expiry-datetime {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1.2px;
            line-height: 1.1;
        }
        
        #overrideSection {
            margin-top: 20px;
            display: none;
        }
        
        .override-box {
            background: var(--surface);
            border: 2px solid #222;
            border-radius: 18px;
            padding: 16px;
        }
        
        .override-header {
            text-align: center;
            cursor: pointer;
            position: relative;
            padding-right: 28px;
            margin-bottom: 8px;
        }
        
        .override-header-title {
            font-size: 15px;
            font-weight: 600;
        }
        
        #calendarArrow {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-secondary);
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 15px;
        }
        
        .calendar-header button {
            background: #f0f0f0;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        
        .calendar-day {
            padding: 9px 0;
            font-size: 14px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 500;
        }
        
        .calendar-day:hover { background: var(--primary-light); }
        
        .calendar-day.selected {
            background: var(--primary);
            color: white;
            font-weight: 700;
        }
        
        .calendar-day.other-month { color: #bbb; }
        
        #settingsPanel {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 10000;
            align-items: flex-end;
        }
        
        .settings-sheet {
            background: var(--surface);
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border-radius: 24px 24px 0 0;
            max-height: 92vh;
            overflow: auto;
        }
        
        .settings-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 10;
        }
        
        .settings-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }
        
        .settings-close {
            background: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .settings-body { padding: 20px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 28px;
            font-size: 14px;
        }
        
        th {
            padding: 10px 6px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
        }
        
        td {
            padding: 12px 6px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        
        .mobile-action-btn {
            min-width: 36px;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            padding: 6px 8px;
            border-radius: 8px;
            margin: 0 2px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: #fafafa;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }
        
        .btn-primary {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        #errorDebug {
            margin: 20px 16px;
            padding: 16px;
            background: #ffebee;
            color: #b71c1c;
            border-radius: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
            display: none;
        }
        
        #timeToggle {
            font-size: 12px;
            padding: 5px 10px;
            border: 1.5px solid var(--primary);
            border-radius: 9999px;
            background: white;
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
            min-width: 64px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="quickNav"></div>
        <div id="productSections"></div>
        <div id="errorDebug"></div>

        <div class="result" id="resultPanel">
            <button class="modal-close" onclick="closeExpiryModal()">×</button>
            <div class="modal-title">Use by</div>
            <div class="expiry-card" id="previewLabel" onclick="copyExpiryLabel()">
                <div class="expiry-product" id="previewProduct"></div>
                <div class="expiry-weekday" id="previewWeekday"></div>
                <div class="expiry-datetime" id="previewDate"></div>
            </div>
            <div id="overrideSection">
                <div class="override-box">
                    <div class="override-header" onclick="toggleCalendar()">
                        <div class="override-header-title">Override date</div>
                        <div id="calendarArrow">▼</div>
                    </div>
                    <div id="calendarContainer" style="display:none;"></div>
                </div>
            </div>
        </div>
        <div id="modalBackdrop" class="modal-backdrop" onclick="closeExpiryModal()"></div>
    </div>

    <div id="settingsPanel">
        <div class="settings-sheet">
            <div class="settings-header">
                <h2>Item Settings</h2>
                <button class="settings-close" onclick="toggleSettings()">✕</button>
            </div>
            <div class="settings-body">
                <table>
                    <thead>
                        <tr>
                            <th style="width:36px; text-align:center;">#</th>
                            <th>Name</th>
                            <th style="width:50px; text-align:center;">Days</th>
                            <th style="width:50px; text-align:center;">Hrs</th>
                            <th style="text-align:center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="settingsItemsList"></tbody>
                </table>
                <h3 id="settingsFormTitle" style="margin-bottom:14px; font-size:16px;">Add / Edit Item</h3>
                <div class="form-group">
                    <label>Unit</label>
                    <select id="newUnit" class="form-control">
                        <option value="days">Days</option>
                        <option value="hours">Hours</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Value</label>
                    <input id="newValue" type="number" placeholder="10" class="form-control">
                </div>
                <div class="form-group">
                    <label>Product name</label>
                    <input id="newName" placeholder="e.g. Hot Honey" class="form-control">
                </div>
                <button onclick="addOrUpdateItem()" class="btn-primary">Save Item</button>
            </div>
        </div>
    </div>

    <script>
        let sections = [
            { title: "Prepped Sauces", items: [
                {name:"Hot Honey", days:35},
                {name:"Burger Sauce", days:14},
                {name:"Cheese Sauce", days:8},
                {name:"Pizza Sauce", days:10},
                {name:"BBQ Sauce", days:10},
                {name:"Garlic Butter", days:10},
                {name:"Pesto Drizzle", days:21},
                {name:"Franks", manualDate: true}
            ]},
            { title: "Veg", items: [
                {name:"Jalapenos", days:11},
                {name:"Pineapple", days:10},
                {name:"Sweetcorn", days:11},
                {name:"Gherkins", days:16},
                {name:"Piquante Peppers", days:25}
            ]},
            { title: "Meats", items: [
                {name:"Tuna", days:6},
                {name:"Chicken Strips", days:9},
                {name:"Tandoori", days:10},
                {name:"Meatballs", days:9},
                {name:"Beef", days:9},
                {name:"Nduja", days:12},
                {name:"Chorizo", days:12},
                {name:"Pepperoni Frozen", days:12},
                {name:"Sausage", days:6},
                {name:"Chinese Chicken", days:9}
            ]},
            { title: "Chicken Sides", items: [
                {name:"Strippers", days:10},
                {name:"Kickers", days:10},
                {name:"Boneless Bites", days:10},
                {name:"Tenders", days:10},
                {name:"Wings", days:9},
                {name:"BBQ Wings", manualDate: true}
            ]},
            { title: "Sides", items: [
                {name:"Wedges", days:7},
                {name:"Fries", days:7},
                {name:"Mac N Cheese", hours:48}
            ]},
            { title: "Cheese", items: [
                {name:"Delight Cheese", days:9},
                {name:"PB Cheese", days:7},
                {name:"String Cheese", days:7},
                {name:"Goats Cheese", days:14}
            ]},
            { title: "Bases", items: [
                {name:"Thin Crust 7\"", days:21},
                {name:"Thin Crust 11.5\"", days:21},
                {name:"Thin Crust 13.5\"", days:21},
                {name:"Wrapz", days:22}
            ]},
            { title: "Dessert", items: [
                {name:"Cookies", days:17},
                {name:"Creme Egg Cookies", days:14},
                {name:"Chocolate Caramel Cookies", days:14},
                {name:"Biscoff", days:30},
                {name:"Chocolate Discs", manualDate: true},
                {name:"White Chocolate Discs", manualDate: true}
            ]},
            { title: "Dips", items: [
                {name: "Garlic 25g", manualDate: true},
                {name: "Garlic 40g", manualDate: true},
                {name: "Garlic 100g", manualDate: true},
                {name: "Franks 25g", manualDate: true},
                {name: "Franks 100g", manualDate: true},
                {name: "H&M 25g", manualDate: true},
                {name: "BBQ 25g", manualDate: true},
                {name: "BBQ 40g", manualDate: true},
                {name: "BBQ 100g", manualDate: true},
                {name: "PB 25g", manualDate: true},
                {name: "Mexicana 40g", manualDate: true},
                {name: "Honey 40g", manualDate: true},
                {name: "Aioli 40g", manualDate: true},
                {name: "Curry 40g", manualDate: true},
                {name: "Teriyaki 40g", manualDate: true},
                {name: "Buffalo 40g", manualDate: true},
                {name: "Chilli 40g", manualDate: true},
                {name: "Ranch 40g", manualDate: true}
            ]},
            { title: "Mix Trays", items: [
                {name: "Mix Tray 9 & 13", special: "9 & 13"},
                {name: "Mix Tray 6 & 11", special: "6 & 11"}
            ]},
            { title: "Dry Stock", items: [
                {name: "Whirl Butter", manualDate: true},
                {name: "Herbs", manualDate: true},
                {name: "Cinnamon Sugar", manualDate: true},
                {name: "Prep Spray", manualDate: true},
                {name: "Cornmeal", manualDate: true}
            ]},
            { title: "Sauces Ambient", items: [
                {name:"Cheese Sauce Ambient", hours:15},
                {name:"Pizza Sauce Ambient", hours:15},
                {name:"BBQ Sauce Ambient", hours:15},
                {name:"Garlic Spread Ambient", hours:12}
            ]}
        ];

        let shelfLifeItems = sections.flatMap(s => s.items.map(i => ({...i})));
        let selectedProduct = null;
        let editingIndex = -1;
        let broughtOutOverride = null;
        let quickNavExpanded = false;
        let currentCalendarDate = new Date();
        let searchTerm = "";

        function scrollToSection(sectionId) {
            const target = document.getElementById(sectionId);
            if (!target) return;
            const nav = document.getElementById("quickNav");
            const navHeight = nav ? nav.offsetHeight : 80;
            const y = target.getBoundingClientRect().top + window.pageYOffset - (navHeight + 12);
            window.scrollTo({ top: y, behavior: 'smooth' });
        }

        function getDisplayName(name) {
            if (name === "Piquante Peppers") return "Piquante";
            if (name === "Cheese Sauce" || name === "Cheese Sauce Ambient") return "C. Sauce";
            if (name === "Chocolate Caramel Cookies") return "C. Cookies";
            if (name === "Burger Sauce") return "🍔 Sauce";
            if (name === "Garlic Butter" || name === "Garlic Spread Ambient") return "Garlic";
            if (name === "Pesto Drizzle") return "Pesto";
            if (name === "Delight Cheese") return "Delight";
            if (name === "String Cheese") return "String";
            if (name === "Goats Cheese") return "G. Cheese";
            if (name === "Boneless Bites") return "B. Bites";
            if (name.includes("Mix Tray")) return "Mix Tray";
            if (name === "Whirl Butter") return "W. Butter";
            if (name === "Cinnamon Sugar") return "C. Sugar";
            if (name === "Chocolate Discs") return "Choc Disc";
            if (name === "White Chocolate Discs") return "W. Choc Disc";
            if (name === "Chinese Chicken") return "CH Chicken";
            return name.replace(/ Ambient$/, '');
        }

        function matchesSearch(item) {
            if (!searchTerm) return true;
            return item.name.toLowerCase().includes(searchTerm.toLowerCase());
        }

        function renderDaysCard(item) {
            const div = document.createElement("div");
            div.className = "product-card" + (selectedProduct && selectedProduct.name === item.name ? " selected" : "");
            const nameEl = document.createElement("div"); nameEl.className = "product-name"; nameEl.textContent = item.name;
            const shelfEl = document.createElement("div"); shelfEl.className = "shelf-life"; 
            shelfEl.textContent = item.special ? "Today" : (item.days + " days");
            div.appendChild(nameEl); div.appendChild(shelfEl);
            div.onclick = () => { 
                triggerHaptic();
                selectedProduct = item; 
                renderProductSections();
                calculateExpiry(); 
            };
            return div;
        }

        function renderHoursCard(item) {
            const div = document.createElement("div");
            div.className = "product-card" + (selectedProduct && selectedProduct.name === item.name ? " selected" : "");
            const nameEl = document.createElement("div"); nameEl.className = "product-name"; nameEl.textContent = item.name;
            const shelfEl = document.createElement("div"); shelfEl.className = "shelf-life"; shelfEl.textContent = item.hours + " hours";
            div.appendChild(nameEl); div.appendChild(shelfEl);
            div.onclick = () => { 
                triggerHaptic();
                selectedProduct = item; 
                renderProductSections();
                calculateExpiry(); 
            };
            return div;
        }

        function renderQuickNav() {
            const nav = document.getElementById("quickNav");
            nav.innerHTML = "";

            const priorityTitles = ["Prepped Sauces", "Veg", "Sauces Ambient"];

            const priorityRow = document.createElement("div");
            priorityRow.className = "nav-row";

            sections.forEach(section => {
                if (section.items.length === 0 || !priorityTitles.includes(section.title)) return;
                const btn = document.createElement("button");
                btn.textContent = section.title === "Prepped Sauces" ? "Sauces" : section.title;
                btn.className = "nav-btn";
                btn.onclick = () => scrollToSection("section-" + section.title.replace(/\s+/g, "-"));
                priorityRow.appendChild(btn);
            });

            const toggleBtn = document.createElement("button");
            toggleBtn.className = "nav-toggle";
            toggleBtn.textContent = quickNavExpanded ? "▲" : "▼";
            toggleBtn.onclick = () => {
                quickNavExpanded = !quickNavExpanded;
                renderQuickNav();
            };
            priorityRow.appendChild(toggleBtn);
            nav.appendChild(priorityRow);

            if (quickNavExpanded) {
                const otherRow = document.createElement("div");
                otherRow.className = "nav-row";
                sections.forEach(section => {
                    if (section.items.length === 0 || priorityTitles.includes(section.title)) return;
                    const btn = document.createElement("button");
                    btn.textContent = section.title;
                    btn.className = "nav-btn";
                    btn.style.fontSize = "12px";
                    btn.style.padding = "7px 12px";
                    btn.onclick = () => scrollToSection("section-" + section.title.replace(/\s+/g, "-"));
                    otherRow.appendChild(btn);
                });
                nav.appendChild(otherRow);
            }

            // Search with single custom clear button
            const searchWrap = document.createElement("div");
            searchWrap.className = "search-wrap";

            const searchInput = document.createElement("input");
            searchInput.type = "search";
            searchInput.id = "searchInput";
            searchInput.className = "search-input";
            searchInput.placeholder = "Search items…";
            searchInput.value = searchTerm;
            searchInput.autocomplete = "off";
            searchInput.autocorrect = "off";
            searchInput.autocapitalize = "off";
            searchInput.spellcheck = false;

            const clearBtn = document.createElement("button");
            clearBtn.type = "button";
            clearBtn.className = "search-clear" + (searchTerm ? " visible" : "");
            clearBtn.innerHTML = "×";
            clearBtn.setAttribute("aria-label", "Clear search");
            clearBtn.onclick = () => {
                searchTerm = "";
                searchInput.value = "";
                clearBtn.classList.remove("visible");
                renderProductSections();
                searchInput.focus();
            };

            searchInput.oninput = (e) => {
                searchTerm = e.target.value;
                clearBtn.classList.toggle("visible", !!searchTerm);
                renderProductSections();
            };

            searchInput.onkeydown = (e) => {
                if (e.key === "Enter") e.target.blur();
            };

            searchWrap.appendChild(searchInput);
            searchWrap.appendChild(clearBtn);
            nav.appendChild(searchWrap);
        }

        function renderProductSections() {
            const container = document.getElementById("productSections");
            container.innerHTML = "";

            sections.forEach(section => {
                const filteredItems = section.items.filter(matchesSearch);
                if (filteredItems.length === 0) return;

                const sectionId = "section-" + section.title.replace(/\s+/g, "-");
                const header = document.createElement("h2");
                header.className = "section-header";
                header.id = sectionId;

                const titleSpan = document.createElement("span");
                titleSpan.textContent = section.title;
                header.appendChild(titleSpan);

                if (section.title === "Sauces Ambient") {
                    const toggle = document.createElement("select");
                    toggle.id = "timeToggle";
                    toggle.innerHTML = `
                        <option value="23">11pm</option>
                        <option value="0">12am</option>
                        <option value="1">1am</option>
                        <option value="2">2am</option>
                        <option value="3">3am</option>
                        <option value="4">4am</option>
                        <option value="5">5am</option>
                    `;
                    toggle.value = broughtOutOverride != null ? broughtOutOverride.toString() : "3";
                    toggle.onchange = updateBroughtOutTime;
                    header.appendChild(toggle);
                }

                container.appendChild(header);

                const grid = document.createElement("div");
                grid.className = "product-grid";
                filteredItems.forEach(item => {
                    if (item.special) {
                        const div = document.createElement("div");
                        div.className = "product-card" + (selectedProduct && selectedProduct.name === item.name ? " selected" : "");
                        const nameEl = document.createElement("div"); nameEl.className = "product-name"; nameEl.textContent = item.name;
                        const shelfEl = document.createElement("div"); shelfEl.className = "shelf-life"; shelfEl.textContent = "Today";
                        div.appendChild(nameEl); div.appendChild(shelfEl);
                        div.onclick = () => { 
                            triggerHaptic();
                            selectedProduct = item; 
                            renderProductSections();
                            calculateExpiry(); 
                        };
                        grid.appendChild(div);
                    } else if (item.manualDate) {
                        const div = document.createElement("div");
                        div.className = "product-card" + (selectedProduct && selectedProduct.name === item.name ? " selected" : "");
                        const nameEl = document.createElement("div"); nameEl.className = "product-name"; nameEl.textContent = item.name;
                        const shelfEl = document.createElement("div"); shelfEl.className = "shelf-life"; shelfEl.textContent = "Select date";
                        div.appendChild(nameEl); div.appendChild(shelfEl);
                        div.onclick = () => { 
                            triggerHaptic();
                            selectedProduct = item; 
                            renderProductSections();
                            calculateExpiry(); 
                        };
                        grid.appendChild(div);
                    } else {
                        grid.appendChild(item.hours ? renderHoursCard(item) : renderDaysCard(item));
                    }
                });
                container.appendChild(grid);
            });
        }

        function renderAll() {
            renderQuickNav();
            renderProductSections();
        }

        function calculateExpiryForDays(product) {
            const now = new Date();
            let expiryDate = new Date(now);
            expiryDate.setDate(expiryDate.getDate() + (product.days || 0) - 1);
            return expiryDate;
        }

        function calculateExpiryForHours(product) {
            return new Date(Date.now() + product.hours * 60 * 60 * 1000);
        }

        function updateBroughtOutTime() {
            const select = document.getElementById("timeToggle");
            broughtOutOverride = select.value ? parseInt(select.value) : null;
            if (broughtOutOverride !== null) localStorage.setItem("closeTime", broughtOutOverride.toString());
            if (selectedProduct && selectedProduct.hours && selectedProduct.name.includes("Ambient")) {
                calculateExpiry();
            }
        }

        function calculateExpiry() {
            if (!selectedProduct) return;
            let expiryDate = selectedProduct.hours ? calculateExpiryForHours(selectedProduct) : calculateExpiryForDays(selectedProduct);

            if (selectedProduct.special || selectedProduct.manualDate) {
                expiryDate = new Date();
            }

            if (selectedProduct.hours && selectedProduct.name.includes("Ambient") && broughtOutOverride !== null) {
                const capHour = broughtOutOverride;
                const nowForCap = new Date();
                let capDate = new Date(nowForCap);
                capDate.setHours(capHour, 0, 0, 0);
                if (capDate.getTime() <= nowForCap.getTime()) capDate.setDate(capDate.getDate() + 1);
                if (expiryDate > capDate) expiryDate = capDate;
            }

            const formatUKDate = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' });
            const getWeekday = d => d.toLocaleDateString('en-GB', { weekday: 'long' });
            const formatTime = d => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

            document.getElementById("previewProduct").textContent = getDisplayName(selectedProduct.name);

            if (selectedProduct.special) {
                document.getElementById("previewWeekday").innerHTML = "";
                document.getElementById("previewDate").innerHTML = formatUKDate(expiryDate) + '<br>' + selectedProduct.special;
            } else {
                document.getElementById("previewWeekday").innerHTML = `<span style="color:#c62828;">${getWeekday(expiryDate)}</span>`;
                if (selectedProduct.hours && selectedProduct.name.includes("Ambient")) {
                    document.getElementById("previewDate").innerHTML = formatUKDate(expiryDate) + '<br>' + formatTime(new Date()) + '–' + formatTime(expiryDate);
                } else if (selectedProduct.hours) {
                    document.getElementById("previewDate").innerHTML = formatUKDate(expiryDate) + '<br>' + formatTime(expiryDate);
                } else {
                    document.getElementById("previewDate").innerHTML = formatUKDate(expiryDate);
                }
            }

            const resultPanelEl = document.getElementById("resultPanel");
            resultPanelEl.style.animation = 'none';
            resultPanelEl.offsetHeight;
            resultPanelEl.style.animation = '';
            resultPanelEl.classList.add("show");
            document.getElementById("modalBackdrop").classList.add("show");
            document.body.style.overflow = 'hidden';

            const overrideSection = document.getElementById("overrideSection");
            if (!selectedProduct.hours && !selectedProduct.special) {
                overrideSection.style.display = "block";
                if (selectedProduct.manualDate) {
                    document.getElementById("calendarContainer").style.display = "block";
                    document.getElementById("calendarArrow").textContent = "▲";
                } else {
                    document.getElementById("calendarContainer").style.display = "none";
                    document.getElementById("calendarArrow").textContent = "▼";
                }
                currentCalendarDate = new Date(expiryDate);
                renderCalendar(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth(), expiryDate);
            } else {
                overrideSection.style.display = "none";
            }
        }

        function renderCalendar(year, month, selectedDate) {
            const container = document.getElementById("calendarContainer");
            container.innerHTML = "";

            const header = document.createElement("div");
            header.className = "calendar-header";
            header.innerHTML = `
                <button onclick="prevMonth()">←</button>
                <span>${new Date(year, month).toLocaleString('default', { month: 'long' })} ${year}</span>
                <button onclick="nextMonth()">→</button>
            `;
            container.appendChild(header);

            const weekdays = document.createElement("div");
            weekdays.className = "calendar-weekdays";
            ['M','T','W','T','F','S','S'].forEach(d => {
                const el = document.createElement("div"); el.textContent = d; weekdays.appendChild(el);
            });
            container.appendChild(weekdays);

            const grid = document.createElement("div");
            grid.className = "calendar-grid";

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startDay = (firstDay === 0) ? 6 : firstDay - 1;

            const prevMonthDays = new Date(year, month, 0).getDate();
            for (let i = startDay - 1; i >= 0; i--) {
                const day = prevMonthDays - i;
                const thisDate = new Date(year, month - 1, day);
                const dayEl = document.createElement("div");
                dayEl.className = "calendar-day other-month";
                dayEl.textContent = day;
                dayEl.onclick = () => selectCalendarDate(thisDate);
                grid.appendChild(dayEl);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement("div");
                dayEl.className = "calendar-day";
                dayEl.textContent = day;
                const thisDate = new Date(year, month, day);
                if (selectedDate && thisDate.toDateString() === selectedDate.toDateString()) {
                    dayEl.classList.add("selected");
                }
                dayEl.onclick = () => selectCalendarDate(thisDate);
                grid.appendChild(dayEl);
            }

            const remaining = 42 - (startDay + daysInMonth);
            for (let i = 1; i <= remaining; i++) {
                const thisDate = new Date(year, month + 1, i);
                const dayEl = document.createElement("div");
                dayEl.className = "calendar-day other-month";
                dayEl.textContent = i;
                dayEl.onclick = () => selectCalendarDate(thisDate);
                grid.appendChild(dayEl);
            }

            container.appendChild(grid);
        }

        function selectCalendarDate(date) {
            document.getElementById("previewDate").innerHTML = date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: '2-digit' });
            document.getElementById("previewWeekday").innerHTML = `<span style="color:#c62828;">${date.toLocaleDateString('en-GB', { weekday: 'long' })}</span>`;
            currentCalendarDate = new Date(date);
            renderCalendar(date.getFullYear(), date.getMonth(), date);
        }

        function prevMonth() {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
            const currentPreview = document.getElementById("previewDate").innerHTML;
            let selected = null;
            if (currentPreview) {
                const [d, m, y] = currentPreview.split('/').map(Number);
                selected = new Date(2000 + y, m - 1, d);
            }
            renderCalendar(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth(), selected);
        }

        function nextMonth() {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
            const currentPreview = document.getElementById("previewDate").innerHTML;
            let selected = null;
            if (currentPreview) {
                const [d, m, y] = currentPreview.split('/').map(Number);
                selected = new Date(2000 + y, m - 1, d);
            }
            renderCalendar(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth(), selected);
        }

        function toggleCalendar() {
            const container = document.getElementById("calendarContainer");
            const arrow = document.getElementById("calendarArrow");
            if (container.style.display === "none" || container.style.display === "") {
                container.style.display = "block";
                arrow.textContent = "▲";
            } else {
                container.style.display = "none";
                arrow.textContent = "▼";
            }
        }

        function closeExpiryModal() {
            document.getElementById("resultPanel").classList.remove("show");
            document.getElementById("modalBackdrop").classList.remove("show");
            document.body.style.overflow = '';
        }

        function copyExpiryLabel() {
            const product = document.getElementById("previewProduct").textContent;
            const weekday = document.getElementById("previewWeekday").textContent.replace(/<[^>]*>/g, '');
            const dateEl = document.getElementById("previewDate");
            const html = dateEl.innerHTML;
            let textToCopy;

            if (html.includes('<br>')) {
                const parts = html.split('<br>');
                const datePart = parts[0].replace(/&amp;/g, '&');
                const timePart = (parts[1] || '').replace(/&amp;/g, '&');
                textToCopy = weekday.trim() === "" 
                    ? product + "\n" + datePart + "\n" + timePart
                    : product + "\n" + weekday + "\n" + datePart + "\n" + timePart;
            } else {
                textToCopy = product + "\n" + weekday + "\n" + dateEl.textContent.replace(/&amp;/g, '&');
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const label = document.getElementById("previewLabel");
                const originalBorder = label.style.border;
                label.style.border = "2.5px solid #1b7a32";
                triggerHaptic();
                setTimeout(() => label.style.border = originalBorder || "2.5px solid #222", 650);
            }).catch(() => {
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                const label = document.getElementById("previewLabel");
                const originalBorder = label.style.border;
                label.style.border = "2.5px solid #1b7a32";
                triggerHaptic();
                setTimeout(() => label.style.border = originalBorder || "2.5px solid #222", 650);
            });
        }

        function toggleSettings() {
            const panel = document.getElementById("settingsPanel");
            panel.style.display = panel.style.display === "flex" ? "none" : "flex";
            if (panel.style.display === "flex") renderSettingsList();
        }

        function moveItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= shelfLifeItems.length) return;
            [shelfLifeItems[index], shelfLifeItems[newIndex]] = [shelfLifeItems[newIndex], shelfLifeItems[index]];
            syncSectionsFromFlat();
            renderSettingsList(); 
            renderAll();
        }

        function renderSettingsList() {
            const tbody = document.getElementById("settingsItemsList");
            tbody.innerHTML = "";
            shelfLifeItems.forEach((item, i) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td style="text-align:center; font-weight:600; color:#888;">${i+1}</td>
                    <td>${item.name}</td>
                    <td style="text-align:center;">${item.days || ''}</td>
                    <td style="text-align:center;">${item.hours || ''}</td>
                    <td style="text-align:center;">
                        <button onclick="moveItem(${i}, -1)" class="mobile-action-btn" style="background:#555;color:white;">↑</button>
                        <button onclick="moveItem(${i}, 1)" class="mobile-action-btn" style="background:#555;color:white;">↓</button>
                        <button onclick="editItem(${i});" class="mobile-action-btn" style="background:#1976d2;color:white;">Edit</button>
                        <button onclick="deleteItem(${i});" class="mobile-action-btn" style="background:#c62828;color:white;">Del</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        function editItem(index) {
            editingIndex = index;
            const item = shelfLifeItems[index];
            document.getElementById("settingsFormTitle").textContent = "Edit Item";
            document.getElementById("newName").value = item.name;
            document.getElementById("newValue").value = item.hours || item.days || "";
            document.getElementById("newUnit").value = item.hours ? "hours" : "days";
        }

        function deleteItem(index) {
            if (confirm("Delete this item permanently? (Only until page refresh)")) {
                shelfLifeItems.splice(index, 1);
                syncSectionsFromFlat();
                renderSettingsList(); 
                renderAll();
            }
        }

        function addOrUpdateItem() {
            const name = document.getElementById("newName").value.trim();
            const value = parseInt(document.getElementById("newValue").value) || 0;
            const unit = document.getElementById("newUnit").value;
            if (!name) return alert("Please enter a product name");
            const newItem = { name };
            if (unit === "hours") newItem.hours = value; else newItem.days = value;
            if (editingIndex >= 0) shelfLifeItems[editingIndex] = newItem; else shelfLifeItems.push(newItem);
            syncSectionsFromFlat();
            renderSettingsList(); 
            renderAll();
            editingIndex = -1;
            document.getElementById("settingsFormTitle").textContent = "Add / Edit Item";
            document.getElementById("newName").value = "";
            document.getElementById("newValue").value = "";
            alert("Item saved! (Temporary – will reset on refresh)");
        }

        function syncSectionsFromFlat() {
            const itemMap = new Map(shelfLifeItems.map(item => [item.name, item]));
            sections.forEach(section => {
                section.items = section.items.map(oldItem => itemMap.get(oldItem.name)).filter(Boolean);
            });
            const existingNames = new Set(sections.flatMap(s => s.items.map(i => i.name)));
            const newItems = shelfLifeItems.filter(item => !existingNames.has(item.name));
            if (newItems.length > 0) {
                let custom = sections.find(s => s.title === "Custom Items");
                if (!custom) { custom = { title: "Custom Items", items: [] }; sections.push(custom); }
                custom.items.push(...newItems);
            }
        }

        function showError(err) {
            const debug = document.getElementById("errorDebug");
            debug.textContent = "ERROR:\n" + err.message + "\n\n" + err.stack;
            debug.style.display = "block";
        }

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(25);
        }

        let touchStartX = 0, touchEndX = 0;

        function setupCalendarSwipe() {
            const cal = document.getElementById("calendarContainer");
            if (!cal) return;
            cal.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            cal.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) < 55) return;
                diff > 0 ? prevMonth() : nextMonth();
            }, { passive: true });
        }

        let modalStartY = 0, modalCurrentY = 0, isDraggingModal = false;

        function setupModalSwipeDown() {
            const modal = document.getElementById("resultPanel");
            if (!modal) return;

            modal.addEventListener('touchstart', function(e) {
                const rect = modal.getBoundingClientRect();
                if (e.touches[0].clientY - rect.top < 140) {
                    modalStartY = e.touches[0].clientY;
                    isDraggingModal = true;
                    modal.style.transition = 'none';
                    modal.style.animation = 'none';
                    modal.style.transform = 'translateX(-50%) translateY(0)';
                }
            }, { passive: true });

            modal.addEventListener('touchmove', function(e) {
                if (!isDraggingModal) return;
                modalCurrentY = e.touches[0].clientY;
                const deltaY = modalCurrentY - modalStartY;
                if (deltaY > 0) {
                    modal.style.transform = `translateX(-50%) translateY(${deltaY}px)`;
                    document.getElementById("modalBackdrop").style.opacity = Math.max(0.5 - (deltaY / 350), 0.12);
                }
            }, { passive: true });

            modal.addEventListener('touchend', function() {
                if (!isDraggingModal) return;
                const deltaY = modalCurrentY - modalStartY;
                const modalEl = document.getElementById("resultPanel");
                const backdrop = document.getElementById("modalBackdrop");

                if (deltaY > 110) {
                    modalEl.style.transition = 'transform 0.3s cubic-bezier(0.32, 0, 0.67, 1), opacity 0.3s ease';
                    modalEl.style.transform = `translateX(-50%) translateY(130%)`;
                    modalEl.style.opacity = '0';
                    backdrop.style.transition = 'opacity 0.3s ease';
                    backdrop.style.opacity = '0';
                    setTimeout(() => {
                        closeExpiryModal();
                        modalEl.style.transform = '';
                        modalEl.style.opacity = '';
                        modalEl.style.transition = '';
                        backdrop.style.opacity = '';
                        backdrop.style.transition = '';
                    }, 300);
                } else {
                    modalEl.style.transition = 'transform 0.22s cubic-bezier(0.32, 0, 0.67, 1)';
                    modalEl.style.transform = 'translateX(-50%) translateY(0)';
                    backdrop.style.transition = 'opacity 0.22s ease';
                    backdrop.style.opacity = '0.5';
                    setTimeout(() => {
                        modalEl.style.transition = '';
                        backdrop.style.transition = '';
                    }, 220);
                }
                isDraggingModal = false;
                modalCurrentY = 0;
            }, { passive: true });
        }

        try {
            const savedCloseTime = localStorage.getItem("closeTime");
            broughtOutOverride = savedCloseTime ? parseInt(savedCloseTime) : 3;
            syncSectionsFromFlat();
            renderAll();
            const timeSelect = document.getElementById("timeToggle");
            if (timeSelect) timeSelect.value = broughtOutOverride != null ? broughtOutOverride.toString() : "3";
            setTimeout(setupCalendarSwipe, 600);
            setTimeout(setupModalSwipeDown, 700);
        } catch (err) {
            showError(err);
        }
    </script>
</body>
</html>
